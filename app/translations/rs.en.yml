en:
  meta:
    title: recall.select - long-term memory for any agent
    description: >-
      Simplest possible semantic memory for AI agents. For any of them. Feed it one URL -
      that's the whole setup. Don't miss, don't forget.
  image:
    alt: recall.select dog logo with the tagline "Don't miss, don't forget"
  body:
    # Headline split so only the middle word is accented (see index.html).
    headline_pre: "Long-term "
    headline_accent: memory
    headline_post: " for any AI agent."
    lead: Long-term memory for any AI agent. Feed it one URL - that's the whole setup.
    # The "why not just a folder?" answer: it recalls by meaning, not exact words.
    # Rendered with |safe because of the inline accent <span>s.
    semantic: >-
      Not just storage: it recalls by meaning. Save
      <span class="rs-accent">“tiramisu”</span> and your agent finds it by asking for
      <span class="rs-accent">“that Italian dessert”</span>.
    slogan_alt: Don't miss, don't forget
    signed_in_as: Signed in as %{email}
    your_account: your account
    sign_out: Sign out
    link_label: Your memory link - feed it to your agent
    copy_button: Copy memory link
    # Shown instead of copy_button when a link already exists: the secret can't
    # be re-shown, so the only action is minting a fresh one.
    regen_button: Get a new link
    # %{action} is the (highlighted) copy_button label, injected so the phrase is
    # authored once. Rendered with |safe because of the inline <span>.
    help_signed_in: >-
      Your link is ready - click <span class="rs-accent">%{action}</span> to copy
      it, then paste it into your agent. Keep it secret; anyone with it can use
      your memory.
    help_signed_out: >-
      Click <span class="rs-accent">%{action}</span> to sign in with Google and
      get your personal link.
    # Shown when a link already exists: only its masked form can be displayed.
    help_link_exists: >-
      You already have a memory link - for safety only part of it is shown here.
      Lost it? Click <span class="rs-accent">%{action}</span>; the old link then
      stops working.
    pricing: Pricing
    language: Language
  # One-line benefits shown in the feature row under the hero (v2 draft).
  features:
    private:
      title: Private & secure
      desc: Only you and your agents have access.
    setup:
      title: One link setup
      desc: Add one URL and you're ready to go.
    # The hero (body.semantic) shows the mechanism; this card shows the everyday
    # value - the audience is non-technical, so the example is from home life.
    memory:
      title: Semantic long-term memory
      desc: Even months later, “the guy who fixed the sink” finds the plumber's number.
    anywhere:
      title: Works anywhere
      desc: Use with any LLM or AI agent.
  # Plans page (templates/plans.html) - a plain one-row-per-plan table.
  plans:
    title: Plans
    heading: Plans
    subhead: One row per tier. Monthly allowances, one price.
    col_plan: Tier
    col_calls: Calls / month
    col_projects: Projects
    col_price: Price / mo
    choose: Choose
    sign_in: Sign in
    current: Current
    back: Back
  # Personal area (templates/account.html) - usage, data deletion, upgrade.
  account:
    title: Account
    heading: Your account
    back: Home
    plan: Your plan
    plan_until: "Active until %{date}"
    upgrade: Upgrade plan
    usage_heading: This month
    calls_metered: "%{used} of %{total} memory actions used"
    calls_unlimited: "%{used} memory actions used"
    calls_remaining: "%{left} left"
    calls_reset: Resets at the start of next month.
    # Sidebar section labels ("API keys" reuses keys_heading below).
    nav_projects: Projects
    nav_billing: Billing
    projects_heading: Your projects
    projects_metered: "%{used} of %{total} in use"
    projects_unlimited: "%{used} in use"
    col_project: Project
    col_stored: Saved memories
    default_badge: Default
    delete_data: Delete data
    empty: Empty
    no_projects: No projects yet. Generate your memory link on the home page to start.
    # API keys panel: masked list, reveal-once creation, revoke.
    keys_heading: API keys
    keys_intro: >-
      Each key is a separate memory link for your agents. A key is shown in full
      only once, right after it's created - after that only its masked form.
    new_key: New key
    col_key: Key
    col_label: Label
    col_created: Created
    col_last_used: Last used
    never_used: Never
    memory_link_badge: Memory link
    reveal_heading: Your new memory link - copy it now
    reveal_note: >-
      For your security it won't be shown again. Keep it secret; anyone who has
      it can use your memory.
    copy: Copy
    revoke: Revoke
    no_keys: No keys yet. Get your memory link on the home page, or create a key here.
    js:
      delete_confirm: Delete all saved memories in "%{name}"? This cannot be undone.
      delete_error: Could not delete the data. Please try again.
      label_prompt: Name this key (optional), e.g. "kitchen laptop"
      create_error: Could not create the key. Please try again.
      revoke_confirm: >-
        Revoke this key? Its memory link stops working right away, and agents
        using it lose access to your memory.
      revoke_error: Could not revoke the key. Please try again.
  # Documentation / integration guides (templates/docs/*). English is the source;
  # other locales fall back here (like plans/account). Long-form guide prose lives
  # in the app.services.docs registry, not in translations, for now.
  docs:
    title: Docs
    integrations: Integrations
    integrations_lead: Connect recall.select to your agent or tool. Pick your setup below.
    nav_heading: Integrations
    install: Install
    using: Using it
    tips: Tips
    related: Related
    copy: Copy
    copied: Copied!
    copy_error: Could not copy. Please copy it manually.
    secret_callout: >-
      Your memory link is the whole credential - anyone who has it can read and
      write your memory. Keep it secret.
    alt_heading: Keep the key out of the URL
    alt_note: >-
      Putting the key in the URL is the simplest setup, but it can end up in logs
      or proxies. To avoid that, point your client at the key-less endpoint and
      send the link in a header instead.
  # Strings surfaced in client-side JS (injected via a JSON block in the page).
  js:
    copied: Copied!
    link_error: Could not create your memory link. Please try again.
    checkout_error: Could not start checkout. Please try again.
    regen_confirm: >-
      You already have a memory link. Getting a new one stops your old link from
      working - agents still using it will lose access. Continue?
