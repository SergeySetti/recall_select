uk:
  meta:
    title: recall.select - довготривала пам'ять для будь-якого агента
    description: >-
      Найпростіша пам'ять для AI-агентів. Для будь-яких із них. Віддайте вашому
      агенту лише одне спеціально сформоване посилання - це і є все налаштування.
      Не пропусти, не забудь.
  image:
    alt: Логотип recall.select із песиком і слоганом «Не пропусти, не забудь»
  body:
    headline_pre: "Довготривала "
    headline_accent: пам'ять
    headline_post: " для будь-якого AI-агента."
    lead: Довготривала семантична пам'ять для будь-якого AI агента. Віддайте йому лише одне спеціально сформоване посилання - це і є все налаштування.
    semantic: >-
      Це не просто сховище: пам'ять шукає за змістом. Збережіть
      <span class="rs-accent">«тірамісу»</span> - і агент знайде його за запитом
      <span class="rs-accent">«той італійський десерт»</span>.
    slogan_alt: Не пропусти, не забудь
    signed_in_as: Ви увійшли як %{email}
    your_account: ваш обліковий запис
    sign_out: Вийти
    link_label: Ваше посилання на пам'ять - передайте його своєму агенту
    copy_button: Скопіювати посилання
    regen_button: Отримати нове посилання
    help_signed_in: >-
      Ваше посилання готове - натисніть <span class="rs-accent">%{action}</span>,
      щоб скопіювати його, а потім вставте його у свого агента. Тримайте його в
      таємниці; будь-хто, хто його має, може користуватися вашою пам'яттю.
    help_signed_out: >-
      Натисніть <span class="rs-accent">%{action}</span>, щоб увійти через Google
      та отримати особисте посилання.
    pricing: Ціни
    language: Мова
  features:
    private:
      title: Приватно й надійно
      desc: Доступ лише у вас і ваших агентів.
    setup:
      title: Налаштування в один клік
      desc: Додайте одне посилання - і все готово.
    memory:
      title: Семантична довготривала пам'ять
      desc: Навіть через місяці «той, хто лагодив раковину» знайде номер сантехніка.
    anywhere:
      title: Працює всюди
      desc: З будь-якою LLM чи AI-агентом.
  js:
    copied: Скопійовано!
    link_error: Не вдалося створити посилання на пам'ять. Спробуйте ще раз.
    regen_confirm: >-
      У вас уже є посилання на пам'ять. Нове посилання вимкне старе - агенти,
      які ним користуються, втратять доступ. Продовжити?
