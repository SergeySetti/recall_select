ru:
  meta:
    title: recall.select - долговременная память для любого агента
    description: >-
      Простейшая память для AI-агентов. Для любого из них. Отдайте вашему агенту
      всего одну специально сформированную ссылку - это и есть вся настройка.
      Не пропусти, не забудь.
  image:
    alt: Логотип recall.select с собачкой и слоганом «Не пропусти, не забудь»
  body:
    headline_pre: "Долговременная "
    headline_accent: память
    headline_post: " для любого AI-агента."
    lead: Долговременная семантическая память для любого AI агента. Отдайте ему всего одну специально сформированную ссылку - это и есть вся настройка.
    semantic: >-
      Это не просто хранилище: память ищет по смыслу. Сохраните
      <span class="rs-accent">«тирамису»</span> - и агент найдёт его по запросу
      <span class="rs-accent">«тот итальянский десерт»</span>.
    slogan_alt: Не пропусти, не забудь
    signed_in_as: Вы вошли как %{email}
    your_account: ваш аккаунт
    sign_out: Выйти
    link_label: Ваша ссылка на память - передайте её своему агенту
    copy_button: Скопировать ссылку
    regen_button: Получить новую ссылку
    help_signed_in: >-
      Ваша ссылка готова - нажмите <span class="rs-accent">%{action}</span>, чтобы
      скопировать её, а затем вставьте её в своего агента. Держите её в секрете;
      любой, у кого она есть, может пользоваться вашей памятью.
    help_signed_out: >-
      Нажмите <span class="rs-accent">%{action}</span>, чтобы войти через Google и
      получить личную ссылку.
    help_link_exists: >-
      У вас уже есть ссылка на память - для безопасности здесь показана лишь её
      часть. Потеряли её? Нажмите <span class="rs-accent">%{action}</span>;
      старая ссылка перестанет работать.
    pricing: Цены
    language: Язык
  features:
    private:
      title: Приватно и надёжно
      desc: Доступ только у вас и ваших агентов.
    setup:
      title: Настройка в один клик
      desc: Добавьте одну ссылку - и всё готово.
    memory:
      title: Семантическая долговременная память
      desc: Даже спустя месяцы «тот, кто чинил раковину» найдёт номер сантехника.
    anywhere:
      title: Работает везде
      desc: С любой LLM или AI-агентом.
  # Страница тарифов (templates/plans.html) - простая таблица, строка на тариф.
  plans:
    title: Тарифы
    heading: Тарифы
    subhead: По строке на тариф. Ежемесячный лимит, одна цена.
    col_plan: Тариф
    col_calls: Обращений в месяц
    col_projects: Проекты
    col_price: Цена в месяц
    choose: Выбрать
    sign_in: Войти
    current: Текущий
    back: Назад
  # Личный кабинет (templates/account.html) - расход, удаление данных, апгрейд.
  account:
    title: Аккаунт
    heading: Ваш аккаунт
    back: На главную
    plan: Ваш тариф
    upgrade: Повысить тариф
    usage_heading: В этом месяце
    calls_metered: "Использовано %{used} из %{total} обращений к памяти"
    calls_unlimited: "Использовано обращений к памяти: %{used}"
    calls_remaining: "осталось %{left}"
    calls_reset: Обновляется в начале следующего месяца.
    nav_projects: Проекты
    nav_billing: Оплата
    projects_heading: Ваши проекты
    projects_metered: "%{used} из %{total} используется"
    projects_unlimited: "%{used} используется"
    col_project: Проект
    col_stored: Сохранённые воспоминания
    default_badge: По умолчанию
    delete_data: Удалить данные
    empty: Пусто
    no_projects: Проектов пока нет. Создайте ссылку на память на главной странице, чтобы начать.
    keys_heading: API-ключи
    keys_intro: >-
      Каждый ключ - это отдельная ссылка на память для ваших агентов. Ключ
      целиком показывается только один раз, сразу после создания; потом - лишь в
      скрытом виде.
    new_key: Новый ключ
    col_key: Ключ
    col_label: Название
    col_created: Создан
    col_last_used: Последнее использование
    never_used: Никогда
    memory_link_badge: Ссылка на память
    reveal_heading: Ваша новая ссылка на память - скопируйте её сейчас
    reveal_note: >-
      В целях безопасности она больше не будет показана. Держите её в секрете;
      любой, у кого она есть, может пользоваться вашей памятью.
    copy: Скопировать
    revoke: Отозвать
    no_keys: Ключей пока нет. Получите ссылку на память на главной странице или создайте ключ здесь.
    js:
      delete_confirm: Удалить все сохранённые воспоминания в «%{name}»? Это действие необратимо.
      delete_error: Не удалось удалить данные. Попробуйте ещё раз.
      label_prompt: Назовите этот ключ (необязательно), например «ноутбук на кухне»
      create_error: Не удалось создать ключ. Попробуйте ещё раз.
      revoke_confirm: >-
        Отозвать этот ключ? Его ссылка на память сразу перестанет работать, и
        агенты, которые ею пользуются, потеряют доступ к вашей памяти.
      revoke_error: Не удалось отозвать ключ. Попробуйте ещё раз.
  # Документация / руководства по интеграции (templates/docs/*).
  docs:
    title: Документация
    integrations: Интеграции
    integrations_lead: Подключите recall.select к своему агенту или инструменту. Выберите вариант настройки ниже.
    nav_heading: Интеграции
    install: Установка
    using: Использование
    tips: Советы
    related: Похожее
    copy: Скопировать
    copied: Скопировано!
    copy_error: Не удалось скопировать. Скопируйте вручную.
    secret_callout: >-
      Ваша ссылка на память - это полный доступ: любой, у кого она есть, может
      читать и записывать вашу память. Держите её в секрете.
    alt_heading: Не держите ключ в URL
    alt_note: >-
      Ключ в URL - самый простой вариант, но он может попасть в логи или прокси.
      Чтобы этого избежать, направьте клиент на эндпоинт без ключа и передавайте
      ссылку в заголовке.
  js:
    copied: Скопировано!
    link_error: Не удалось создать ссылку на память. Попробуйте ещё раз.
    checkout_error: Не удалось начать оплату. Попробуйте ещё раз.
    regen_confirm: >-
      У вас уже есть ссылка на память. Новая ссылка отключит старую - агенты,
      которые ею пользуются, потеряют доступ. Продолжить?
