[project]
name = "recall-select"
version = "0.1.0"
description = "recall.select - a minimal agentic memory system (single-URL onboarding)."
authors = [
    { name = "Setti", email = "setti.biz@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137.1",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-dotenv",
    "mcp>=1.26",             # official MCP SDK (FastMCP + Streamable HTTP transport)
    "qdrant-client>=1.12",
    "pymongo>=4.6",
    "injector>=0.24.0",
    "authlib>=1.3",          # Google OAuth (OpenID Connect) client
    "itsdangerous>=2.0",     # signs Starlette SessionMiddleware cookies
    "python-i18n>=0.3",      # translation strings (YAML-backed t() helper)
    "cryptography>=43",      # verifies Monobank webhook signatures (ECDSA-SHA256)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mongomock>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
