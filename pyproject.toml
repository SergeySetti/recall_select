[project]
name = "recall-select"
version = "0.1.0"
description = "recall.select - a minimal agentic memory system (single-URL onboarding)."
authors = [
    { name = "Setti", email = "setti.biz@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.49",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "python-dotenv",
    # Official MCP SDK (FastMCP + Streamable HTTP transport). Capped below 2.0:
    # the 2.x line moved `mcp.server.fastmcp`, so an unpinned rebuild imports
    # nothing and the app fails at startup (app/mcp_server.py).
    "mcp>=1.28,<2",
    "qdrant-client>=1.18",
    "pymongo>=4.6",
    "injector>=0.24.0",
    "authlib>=1.7",          # Google OAuth (OpenID Connect) client
    "itsdangerous>=2.2",     # signs Starlette SessionMiddleware cookies
    "python-i18n>=0.3",      # translation strings (YAML-backed t() helper)
    "cryptography>=49",      # verifies Monobank webhook signatures (ECDSA-SHA256)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mongomock>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
